<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 857" width="844" height="857" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4fc3e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fc3e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc8ec"/>
      <stop offset="1" stop-color="#43b0dc"/>
    </linearGradient>
    <linearGradient id="botPlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46b4de"/>
      <stop offset="1" stop-color="#58c4ea"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- radiating lines from upper-left hub -->
  <g stroke="#2a5560" stroke-width="1" opacity="0.55" fill="none">
    <line x1="263" y1="145" x2="0" y2="20"/>
    <line x1="263" y1="145" x2="80" y2="0"/>
    <line x1="263" y1="145" x2="190" y2="0"/>
    <line x1="263" y1="145" x2="255" y2="0"/>
    <line x1="263" y1="145" x2="330" y2="0"/>
    <line x1="263" y1="145" x2="520" y2="0"/>
    <line x1="263" y1="145" x2="0" y2="130"/>
    <line x1="263" y1="145" x2="0" y2="280"/>
    <line x1="263" y1="145" x2="600" y2="170"/>
    <line x1="263" y1="145" x2="420" y2="400"/>
    <line x1="263" y1="145" x2="360" y2="380"/>
  </g>
  <circle cx="263" cy="145" r="3" fill="#2f6573" opacity="0.8"/>

  <!-- rings -->
  <ellipse cx="425" cy="415" rx="305" ry="298" fill="none" stroke="#24505c" stroke-width="1" opacity="0.5"/>
  <ellipse cx="398" cy="442" rx="244" ry="236" fill="none" stroke="#3d8394" stroke-width="1.4" stroke-dasharray="7 6" opacity="0.7"/>
  <ellipse cx="408" cy="430" rx="182" ry="178" fill="none" stroke="#2b5d6a" stroke-width="1.2" opacity="0.6"/>

  <!-- icon glow -->
  <ellipse cx="372" cy="452" rx="170" ry="120" fill="url(#glow)"/>

  <!-- layers icon -->
  <g>
    <!-- bottom plate (glow + shape) -->
    <path d="M255 456 Q252 449 262 447 L352 480 L478 468 Q492 470 490 482 L372 524 Q354 534 340 526 Z"
          fill="#4fc3e8" opacity="0.5" filter="url(#blur)"/>
    <path d="M256 456 Q254 449 264 449 L330 470 L470 470 Q492 472 490 484 L378 524 Q358 534 340 526 Z"
          fill="url(#botPlate)"/>

    <!-- shadow / thickness between plates -->
    <path d="M280 428 L362 466 Q372 470 385 466 L468 438 L468 452 Q468 462 458 466 L395 492 Q380 497 366 492 L290 458 Q280 452 280 442 Z"
          fill="#17566f"/>

    <!-- top plate -->
    <path d="M280 420 Q276 412 288 407 L356 382 Q370 376 384 381 L462 417 Q472 424 466 434 L400 470 Q388 477 374 472 L292 434 Q282 430 280 420 Z"
          fill="url(#topPlate)"/>
  </g>

  <!-- orbiting orb -->
  <circle cx="626" cy="553" r="22" fill="#4fc3e8" opacity="0.4" filter="url(#softGlow)"/>
  <circle cx="626" cy="553" r="13" fill="#4fc3e8"/>

  <!-- small particles -->
  <g>
    <rect x="193" y="419" width="10" height="10" rx="1.5" fill="#f2f6f8"/>
    <rect x="175" y="370" width="6" height="6" rx="1" fill="#8aa0a8" opacity="0.8"/>
    <rect x="208" y="503" width="5" height="5" rx="1" fill="#8aa0a8" opacity="0.7"/>
    <rect x="292" y="582" width="5" height="5" rx="1" fill="#8aa0a8" opacity="0.7"/>
    <rect x="381" y="620" width="4" height="4" rx="1" fill="#8aa0a8" opacity="0.6"/>
    <rect x="475" y="639" width="5" height="5" rx="1" fill="#c9d6db" opacity="0.8"/>
    <circle cx="582" cy="617" r="3" fill="#3d8394" opacity="0.7"/>
    <rect x="219" y="772" width="11" height="11" rx="1.5" fill="#f2f6f8"/>
    <rect x="264" y="745" width="9" height="9" rx="1.5" fill="#9aaab1" opacity="0.8"/>
    <circle cx="189" cy="761" r="6" fill="#1d3a46" opacity="0.8"/>
    <circle cx="492" cy="755" r="7" fill="#1d3a46" opacity="0.7"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
